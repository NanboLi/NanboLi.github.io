<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign description = page.description | default: page.summary | default: page.excerpt | default: site.description | strip_html | strip_newlines %}
<title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}{{ site.name | escape }}</title>
<meta name="description" content="{{ description | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:type" content="{% if page.collection == 'publications' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.name | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/landscape-book.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@nbl_ai">
<meta name="theme-color" content="#FBF8F1">
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":{{ site.name | jsonify }},"alternateName":"李南伯","url":{{ '/' | absolute_url | jsonify }},"sameAs":[{{ site.author.googlescholar | jsonify }},"https://github.com/{{ site.author.github }}"]}
</script>
